# Reusable: builds docker/Dockerfile from an already-uploaded toolchain
# artifact, smoke-tests it, and pushes it to ghcr.io. Called by build.yml's
# manual `docker` job and by release.yml, so the logic lives in one place.
name: docker-image

on:
  workflow_call:
    inputs:
      channel:
        description: "stable or beta - tagged as ghcr.io/<owner>/rust-mos:<channel>"
        required: true
        type: string
      artifact_name:
        description: "Name of the already-uploaded toolchain-*.tar.xz artifact"
        required: true
        type: string
      release:
        description: >-
          True only from release.yml: also push the versioned tags
          (scripts/docker-tags.sh: <X.Y.Z>-mos.<N> and <X.Y> for stable,
          <X.Y.Z>-beta-mos.<commit7> for beta), computed there from
          versions.toml so it never depends on matrix job outputs, which
          GitHub Actions does not pair by matrix key across jobs). False
          from build.yml's manual/ad hoc test dispatch, which must never
          push a versioned tag for an untested channel state.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: docker

      - name: Rename for the Dockerfile's COPY
        run: mv docker/rust-mos-*.tar.xz docker/toolchain.tar.xz

      - name: SDK version from versions.toml
        id: sdk
        run: |
          . scripts/lib.sh
          echo "release=$(ver_get llvm_mos_sdk.release)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(ver_get llvm_mos_sdk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Tags and labels to push
        id: tags
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          . scripts/lib.sh
          tags=$(scripts/docker-tags.sh "${{ inputs.channel }}" "${{ inputs.release }}" "${{ github.sha }}")
          ch="${{ inputs.channel }}"
          if [ "$ch" = stable ]; then rust=$(ver_get rust.stable.tag); else rust=$(ver_get rust.beta.tag); fi
          llvm_branch=$(ver_get "rust.$ch.llvm_branch")
          {
            echo "tags<<TAGSEOF"; echo "$tags"; echo "TAGSEOF"
            echo "labels<<LABELSEOF"
            echo "org.opencontainers.image.version=$rust ($ch)"
            echo "io.github.sbechet.rust-mos.channel=$ch"
            echo "io.github.sbechet.rust-mos.rust=$rust"
            echo "io.github.sbechet.rust-mos.llvm=$(llvm_version_of_branch "$llvm_branch") ($llvm_branch @ $(ver_get "rust.$ch.llvm_commit" | cut -c1-12))"
            echo "io.github.sbechet.rust-mos.llvm-mos-sdk=$(ver_get llvm_mos_sdk.release)"
            echo "LABELSEOF"
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: rust-mos:smoke-test
          build-args: |
            SDK_RELEASE=${{ steps.sdk.outputs.release }}
            SDK_SHA256=${{ steps.sdk.outputs.sha256 }}
          load: true

      - name: Smoke test — build and run hello on mos-sim
        run: |
          docker run --rm -v "$PWD/tests/programs/hello:/src" rust-mos:smoke-test \
            cargo build --release --target mos-sim-none
          out=$(docker run --rm -v "$PWD/tests/programs/hello:/src" rust-mos:smoke-test \
            mos-sim target/mos-sim-none/release/hello)
          [ "$out" = "$(cat tests/programs/hello/expected.stdout)" ] \
            || { echo "unexpected output: $out"; exit 1; }

      - name: Smoke test — link every platform (no emulator in CI)
        run: |
          # tests/link-check calls no libc function (the Atari 2600 has no
          # putchar, so tests/programs/hello cannot link there). Every
          # built-in MOS target is checked except mos-unknown-none (no real
          # platform to link against) and mos-sim-none (build+run above).
          # All targets are tried before failing, to report every broken one.
          targets=$(docker run --rm rust-mos:smoke-test rustc --print target-list \
            | grep '^mos-' | grep -v -e mos-unknown-none -e mos-sim-none)
          failed=""
          for t in $targets; do
            echo "::group::$t"
            docker run --rm -v "$PWD/tests/link-check:/src" rust-mos:smoke-test \
              cargo build --release --target "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::link failed for:$failed"; exit 1; }

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            SDK_RELEASE=${{ steps.sdk.outputs.release }}
            SDK_SHA256=${{ steps.sdk.outputs.sha256 }}
