# Builds the toolchain from patches/ + versions.toml and runs the test tiers.
#   llvm: patched LLVM, reused from the `llvm-cache` release when the key
#         already exists (docs/git-and-distribution.md §2.3), else built,
#         lit-tested and uploaded there.
#   rust: patched rustc + MOS core/alloc, tested on mos-sim with vanilla cargo.
name: build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Rust channel from versions.toml"
        type: choice
        options: [stable, beta]
        default: stable
      stage:
        description: "rustc stage (1 = faster, 2 = what dist ships)"
        type: choice
        options: ["1", "2"]
        default: "1"
      build_docker:
        description: "Also build (and push) the ghcr.io Docker image"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [patches/**, scripts/**, config/**, tests/**, versions.toml, .github/workflows/build.yml]
  pull_request:
    paths: [patches/**, scripts/**, config/**, tests/**, versions.toml, .github/workflows/build.yml]

permissions:
  contents: write
  packages: write   # docker job: push to ghcr.io

concurrency:
  group: build-${{ github.ref }}-${{ inputs.channel || 'stable' }}
  # A new push waits for the running build instead of killing hours of work.
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel || 'stable' }}
  STAGE: ${{ inputs.stage || '1' }}
  # Uploading to the llvm-cache release needs write access (not on fork PRs).
  CAN_PUBLISH: ${{ github.event_name != 'pull_request' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      key: ${{ steps.key.outputs.key }}
      cached: ${{ steps.key.outputs.cached }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: |
          key=$(scripts/build-llvm.sh --key "$CHANNEL")
          asset="llvm-$key-x86_64-unknown-linux-gnu.tar.xz"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if curl -sfIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/llvm-cache/$asset"; then
            echo "cached=true" >> "$GITHUB_OUTPUT"; echo "LLVM $key already in llvm-cache"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"; echo "LLVM $key must be built"
          fi

      - name: Free disk space
        if: steps.key.outputs.cached != 'true'
        run: .github/free-disk.sh

      - name: Install build tools
        if: steps.key.outputs.cached != 'true'
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build lld ccache

      - name: Restore ccache
        if: steps.key.outputs.cached != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-llvm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-llvm-

      - name: Fetch and patch LLVM
        if: steps.key.outputs.cached != 'true'
        run: |
          scripts/fetch.sh llvm "$CHANNEL"
          scripts/apply.sh llvm "base-$CHANNEL"

      - name: Build LLVM
        if: steps.key.outputs.cached != 'true'
        env:
          LLVM_NO_DOWNLOAD: "1"
          LLVM_KEEP_GOING: "1"
          LINK_JOBS: "2"
          CCACHE_MAXSIZE: 3G
        run: scripts/build-llvm.sh "$CHANNEL"

      # Saved even when the build fails, so the next attempt resumes from here.
      - name: Save ccache
        if: always() && steps.key.outputs.cached != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-llvm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test tier 1 (llvm-lit MOS)
        if: steps.key.outputs.cached != 'true'
        run: scripts/test.sh llvm

      - name: Package LLVM
        if: steps.key.outputs.cached != 'true'
        run: scripts/build-llvm.sh --package "$CHANNEL"

      - name: Publish to the llvm-cache release
        if: steps.key.outputs.cached != 'true' && env.CAN_PUBLISH == 'true'
        run: |
          gh release view llvm-cache >/dev/null 2>&1 || gh release create llvm-cache \
            --prerelease --title "LLVM build cache" \
            --notes "Patched LLVM installs keyed by scripts/build-llvm.sh --key. Not for end users."
          gh release upload llvm-cache "work/${{ steps.key.outputs.asset }}" --clobber

      - name: Hand LLVM to the rust job
        if: steps.key.outputs.cached != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: llvm
          path: work/${{ steps.key.outputs.asset }}
          compression-level: 0
          retention-days: 3

      - name: Errors as annotations
        if: failure()
        run: .github/annotate-errors.sh work/llvm-cmake.log work/llvm-build.log work/test-report.txt

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-logs
          path: |
            work/*.log
            work/test-report.txt

  rust:
    needs: llvm
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: .github/free-disk.sh

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build pkg-config libssl-dev

      - name: LLVM from this run
        if: needs.llvm.outputs.cached != 'true'
        uses: actions/download-artifact@v4
        with:
          name: llvm
          path: llvm-dl

      - name: Point build-llvm.sh at the LLVM of this run
        if: needs.llvm.outputs.cached != 'true'
        run: echo "LLVM_CACHE_URL=file://$GITHUB_WORKSPACE/llvm-dl" >> "$GITHUB_ENV"

      - name: Fetch and patch Rust
        run: |
          scripts/fetch.sh rust "$CHANNEL"
          scripts/apply.sh rust "base-$CHANNEL"

      - name: Build rustc and the MOS libraries
        run: scripts/build-rust.sh "$CHANNEL"

      - name: Test tiers 2-5
        run: scripts/test.sh std run size smoke

      - name: Errors as annotations
        if: failure()
        run: .github/annotate-errors.sh work/rust-build.log work/test-programs.log work/smoke.log work/test-report.txt

      - name: Package toolchain
        if: always()
        run: |
          # No rustc means an earlier step already failed and reported it;
          # dist.sh itself failing here (rustc present but packaging broken)
          # is a real problem and should fail this step.
          [ -x "work/rust/build/x86_64-unknown-linux-gnu/stage$STAGE/bin/rustc" ] || exit 0
          scripts/dist.sh "$CHANNEL"

      - name: Upload toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ env.CHANNEL }}-x86_64-unknown-linux-gnu
          path: work/rust-mos-*.tar.xz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-logs
          path: |
            work/*.log
            work/test-report.txt
            work/size-current.json
            work/rust/bootstrap.toml

  # Manual only for now (build_docker input): no compilation happens here,
  # it packages this run's own toolchain artifact + the pinned llvm-mos SDK
  # release (docs/git-and-distribution.md §2.2). Smoke-tests on mos-sim
  # before pushing, since a broken image would otherwise ship silently.
  docker:
    needs: rust
    if: inputs.build_docker == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain from this run
        uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ env.CHANNEL }}-x86_64-unknown-linux-gnu
          path: docker

      - name: Rename for the Dockerfile's COPY
        run: mv docker/rust-mos-*.tar.xz docker/toolchain.tar.xz

      - name: SDK version from versions.toml
        id: sdk
        run: |
          . scripts/lib.sh
          echo "release=$(ver_get llvm_mos_sdk.release)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(ver_get llvm_mos_sdk.sha256)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: rust-mos:smoke-test
          build-args: |
            SDK_RELEASE=${{ steps.sdk.outputs.release }}
            SDK_SHA256=${{ steps.sdk.outputs.sha256 }}
          load: true

      - name: Smoke test — build and run hello on mos-sim
        run: |
          docker run --rm -v "$PWD/tests/programs/hello:/src" rust-mos:smoke-test \
            cargo build --release --target mos-sim-none
          out=$(docker run --rm -v "$PWD/tests/programs/hello:/src" rust-mos:smoke-test \
            mos-sim target/mos-sim-none/release/hello)
          [ "$out" = "$(cat tests/programs/hello/expected.stdout)" ] \
            || { echo "unexpected output: $out"; exit 1; }

      - name: Smoke test — build for mos-c64-none (links, not run)
        run: |
          docker run --rm -v "$PWD/tests/programs/hello:/src" rust-mos:smoke-test \
            cargo build --release --target mos-c64-none

      - name: Log in to ghcr.io
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: env.CAN_PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rust-mos:${{ env.CHANNEL }}
            ghcr.io/${{ github.repository_owner }}/rust-mos:sha-${{ github.sha }}
          build-args: |
            SDK_RELEASE=${{ steps.sdk.outputs.release }}
            SDK_SHA256=${{ steps.sdk.outputs.sha256 }}
