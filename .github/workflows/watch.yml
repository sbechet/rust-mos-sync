# Daily detection (PLAN.md §7.1): runs detect.sh's full check and dispatches
# sync-rust.yml for whichever channel(s) need it.
#
# GitHub's default GITHUB_TOKEN cannot dispatch another workflow's
# workflow_dispatch event (a deliberate anti-loop restriction on the token
# itself, not on the method used) - only a personal access token can. If the
# maintainer adds a fine-grained PAT with this repo's Actions:Read and write
# permission as the repo secret WORKFLOW_DISPATCH_TOKEN, this workflow
# dispatches sync-rust.yml and sync-mos-backend.yml automatically; without
# it, a `sync-rust`/`sync-mos-backend` line falls back to the tracking issue
# below like every other kind.
#
# `sync-rust` and `sync-mos-backend` lines are auto-dispatched (both need the
# token; PLAN.md §10 auto-merges both if tests pass). `llvm-bump` always
# needs human approval (PLAN.md §7.4/§10 - never auto-dispatched, token or
# not) and is always reported in the tracking issue below.
name: watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HAVE_PAT: ${{ secrets.WORKFLOW_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: detect.sh (full check)
        id: detect
        run: |
          scripts/detect.sh | tee /tmp/actions.txt
          echo "found=$([ -s /tmp/actions.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Dispatch sync-rust.yml and sync-mos-backend.yml automatically
        if: steps.detect.outputs.found == 'true' && env.HAVE_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          while read -r _ kind channel _rest; do
            case "$kind" in
                sync-rust)
                    echo "dispatching sync-rust.yml for $channel"
                    gh workflow run sync-rust.yml -f "channel=$channel"
                    ;;
                sync-mos-backend)
                    # llvm_mos.last_synced/deferred are global (PLAN.md §5),
                    # not per Rust channel - detect.sh's third field here is
                    # the llvm-mos branch ("main"), not a channel. Pick
                    # stable (sync-mos-backend.yml's own default): if stable
                    # and beta ever sit on different LLVM branches, the
                    # maintainer dispatches it for beta by hand too.
                    echo "dispatching sync-mos-backend.yml for stable"
                    gh workflow run sync-mos-backend.yml -f "channel=stable"
                    ;;
            esac
          done < /tmp/actions.txt

      # `sync-rust`/`sync-mos-backend` lines are handled above once a
      # dispatch token exists, so they no longer belong in the tracking
      # issue. `llvm-bump` always needs human approval (PLAN.md §7.4/§10 -
      # never auto-dispatched, token or not) and must keep surfacing here
      # regardless of HAVE_PAT, or it would silently stop being reported the
      # day a token is added.
      - name: What's left for a human
        id: pending
        run: |
          awk -v have_pat="$HAVE_PAT" \
              '!(have_pat == "true" && ($2 == "sync-rust" || $2 == "sync-mos-backend"))' \
              /tmp/actions.txt > /tmp/pending.txt
          echo "any=$([ -s /tmp/pending.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Track what's pending for a human
        if: steps.pending.outputs.any == 'true'
        run: |
          {
            echo "detect.sh found the following pending as of $(date -u +%F):"
            echo
            echo '```'
            cat /tmp/pending.txt
            echo '```'
            echo
            echo "\`llvm-bump\` always needs human approval (PLAN.md §7.4/§10) -"
            echo "run \`llvm-bump.yml\` by hand. \`sync-mos-backend\` has no"
            echo "workflow yet (Phase 4) - informational only."
            if [ "$HAVE_PAT" != true ]; then
              echo
              echo "No \`WORKFLOW_DISPATCH_TOKEN\` repo secret is configured, so a"
              echo "\`sync-rust\` line above wasn't dispatched automatically either -"
              echo "run \`sync-rust.yml\` by hand for it."
            fi
          } > /tmp/issue.md
          scripts/github.sh issue-open watch-pending "Pending upstream syncs" /tmp/issue.md

      - name: Nothing left pending, close the tracking issue if any
        if: steps.pending.outputs.any == 'false'
        run: scripts/github.sh issue-close watch-pending "Nothing pending anymore."
